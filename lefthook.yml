# Lefthook — Git hooks manager
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      root: "app/"
      run: cargo fmt --all -- --check
      fail_text: "Run `cargo fmt --all` in app/ to fix formatting"

    rust-clippy:
      root: "app/"
      run: cargo clippy --workspace --all-targets -- -D warnings
      fail_text: "Fix clippy warnings in app/ before committing"

    web-lint:
      root: "web/"
      run: pnpm lint
      fail_text: "Run `pnpm lint` in web/ to see lint errors"

    web-typecheck:
      root: "web/"
      run: pnpm typecheck
      fail_text: "Fix TypeScript errors in web/ before committing"

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}
      fail_text: "Commit message must follow Conventional Commits: https://www.conventionalcommits.org"
